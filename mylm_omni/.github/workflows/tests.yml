name: MyLM-omni tests

on:
  push:
    paths:
      - "mylm_omni/**"
  pull_request:
    paths:
      - "mylm_omni/**"
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mylm_omni
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: mylm_omni/pyproject.toml
      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Run unit tests
        run: python -m pytest -q
      - name: Compile Python sources
        run: python -m compileall -q src scripts
      - name: Build clean source-only ZIP
        run: python scripts/package_project.py --output ../mylm-omni-dist/mylm-omni.zip
      - name: Upload source ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: mylm-omni-source-${{ github.sha }}
          path: mylm-omni-dist/mylm-omni.zip
          if-no-files-found: error
          retention-days: 30
