[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mylm-omni"
version = "0.1.0"
description = "Research scaffold for a small recurrent multimodal LLM agent with auditable memory"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "torch>=2.4",
  "numpy>=1.26",
  "safetensors>=0.4.3",
]

[project.optional-dependencies]
runtime = ["transformers>=4.57", "pillow>=10.0"]
train = [
  "transformers>=4.57",
  "datasets>=3.0",
  "accelerate>=1.0",
  "wandb>=0.18",
]
qat = ["torchao>=0.17"]
low-memory = ["bitsandbytes>=0.44"]
qlora = ["transformers>=4.57", "peft>=0.13", "bitsandbytes>=0.44", "accelerate>=1.0", "datasets>=3.0"]
multimodal = ["transformers>=4.57", "peft>=0.13", "bitsandbytes>=0.44", "accelerate>=1.0", "pillow>=10.0", "datasets>=3.0"]
audio = ["faster-whisper>=1.1"]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
